name: MIDI to ASM and native ncurses editor

on:
  push:
    branches: [main]
  pull_request:

jobs:
  midi-converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native terminal UI library
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Build the C/ncurses MIDI editor
        run: make out/tools/PPA-1_MIDI-to-ASM
      - name: Test MIDI conversion, track optimization and multi-bank PRG
        run: make test-midi test-irq
      - name: Install SDL3 dependencies for sound-module GUI build
        run: sudo apt-get install -y libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev
      - name: Build SDL3 emulator with PPA-SOUND ADSR display
        run: make emu
