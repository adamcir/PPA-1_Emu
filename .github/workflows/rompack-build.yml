name: Build ROM graphics example

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rom-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native ROM packer and ASM graphics demo
        run: make rompack out/examples/other/rom_gfx_demo.bin
      - name: Verify example's intermediate and EEPROM image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          program=Path("out/examples/other/rom_gfx_demo.prg").read_bytes()
          rom=Path("out/examples/other/rom_gfx_demo.bin").read_bytes()
          assert len(program)==65536
          assert len(rom)==2*1024*1024
          assert rom[:65536]==program
          print("Example ASM -> PRG -> ROMPACK: OK")
          PY
      - name: Test ROM packer
        run: make test-rompack
      - name: Smoke-test BMP packing into demo ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          w,h=320,200
          rows=(bytes([60,90,120])*w)*h
          header=struct.pack("<2sIHHIIiiHHIIiiII", b"BM",54+len(rows),0,0,54,40,w,h,1,24,0,len(rows),2835,2835,0,0)
          Path("/tmp/demo.bmp").write_bytes(header+rows)
          PY
          make rom-graphics-demo BMP=/tmp/demo.bmp
          python3 - <<'PY'
          from pathlib import Path
          d=Path("out/examples/other/rom_gfx_demo_packed.bin").read_bytes()
          assert len(d)==2*1024*1024
          assert d[:65536]==Path("out/examples/other/rom_gfx_demo.prg").read_bytes()
          assert d[65536:65540]==b"PIMG"
          print("Graphics example packed and ready")
          PY
